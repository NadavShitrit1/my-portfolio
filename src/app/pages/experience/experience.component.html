<section class="section experience">
  <!-- Education Section -->
  <h2 class="section-title">Education</h2>
  <div class="timeline">
    <div
      class="timeline-item"
      *ngFor="let item of education; let i = index"
      (click)="toggle('education', i)"
      [class.open]="openEducationIndex === i"
    >
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <h3>{{ item.title }}</h3>
        <span>{{ item.period }}</span>
        <div class="timeline-body" *ngIf="openEducationIndex === i" [innerHTML]="item.content"></div>
      </div>
    </div>
  </div>

  <!-- Experience Section -->
  <h2 class="section-title">Experience</h2>
  <div class="timeline">
    <div
      class="timeline-item"
      *ngFor="let item of experience; let i = index"
      (click)="toggle('experience', i)"
      [class.open]="openExperienceIndex === i"
    >
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <h3>{{ item.title }}</h3>
        <span>{{ item.period }}</span>
        <div class="timeline-body" *ngIf="openExperienceIndex === i" [innerHTML]="item.content"></div>
      </div>
    </div>
  </div>
</section>
